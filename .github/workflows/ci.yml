name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  validate-and-test:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @gapji/api exec prisma generate

      - name: Run Phase 1 to Phase 9 Automated Regression Tests
        run: |
          node apps/web/scripts/test-phase-001-bridge-search.mjs
          node apps/web/scripts/test-phase-002-notifications.mjs
          node apps/web/scripts/test-phase-003-equipment.mjs
          node apps/web/scripts/test-phase-004-meetings.mjs
          node apps/web/scripts/test-phase-005-sops.mjs
          node apps/web/scripts/test-phase-006-learning.mjs
          node apps/web/scripts/test-phase-007-ideas.mjs
          node apps/web/scripts/test-phase-008-activity.mjs
          node apps/web/scripts/test-phase-009-wordpress.mjs

      - name: Build API Service (@gapji/api)
        run: pnpm --filter @gapji/api build

      - name: Build Web Application (@gapji/web)
        run: pnpm --filter @gapji/web build
