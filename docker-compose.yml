services:
  postgres:
    image: postgres:15-alpine
    container_name: gapji-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gapji_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gapji_password}
      POSTGRES_DB: ${POSTGRES_DB:-gapji_dashboard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gapji_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gapji_user} -d ${POSTGRES_DB:-gapji_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gapji_postgres_data:
